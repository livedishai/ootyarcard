<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta http-equiv="Permissions-Policy" content="camera=*">
<title>AR Menu – 3D Dish Try-On</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:rgba(201,168,76,.18);--gold-border:rgba(201,168,76,.28);--ink:#0A0A0A;--cream:#F5F0E8;--glass-dark:rgba(6,5,4,.72);--radius-pill:100px;--text-main:#FFD76A;--text-sub:#FFFFFF}
html,body{width:100%;height:100%;font-family:'Jost',sans-serif;background:#060504;overflow:hidden;overscroll-behavior:none;position:fixed;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
.a-enter-vr-button{display:none!important}
a-scene{position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;z-index:0!important}
canvas.a-canvas{width:100%!important;height:100%!important;position:fixed!important;top:0!important;left:0!important}
video{position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:-1!important}

/* START */
#startScreen{position:fixed;inset:0;background:#060504;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:40px 32px;transition:opacity .4s}
.start-inner{display:flex;flex-direction:column;align-items:center;max-width:320px;width:100%}
.start-ornament{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.start-ornament-line{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.start-ornament-line.right{background:linear-gradient(90deg,var(--gold),transparent)}
.start-ornament-diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
img.start-logo{width:140px;height:140px;object-fit:contain;margin-bottom:44px;filter:brightness(0) invert(1) sepia(1) saturate(.6)}
.start-eyebrow{font-size:10px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
#startScreen h1{font-family:'Cormorant Garamond',serif;color:var(--cream);font-size:36px;font-weight:300;line-height:1.15;text-align:center;margin-bottom:20px}
#startScreen h1 em{font-style:italic;color:var(--gold-light)}
#startScreen p.desc{color:rgba(245,240,232,.42);font-size:13px;font-weight:300;text-align:center;line-height:1.75;margin-bottom:36px}
#startBtn,#retryBtn{padding:16px 42px;font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;border:1px solid var(--gold-border);border-radius:var(--radius-pill);background:transparent;color:var(--gold-light);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#startBtn:active{background:var(--gold);color:var(--ink)}
#retryBtn{margin-top:8px;padding:12px 28px;font-size:11px}

/* LOADING / ERROR */
#loadingOverlay,#errorOverlay{position:fixed;inset:0;background:#060504;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:998;gap:20px;padding:36px;text-align:center}
#loadingOverlay.show,#errorOverlay.show{display:flex}
.loading-ring{width:56px;height:56px;border:1px solid rgba(201,168,76,.15);border-top-color:var(--gold);border-radius:50%;animation:spin 1.2s linear infinite}
#loadingStatus{color:rgba(245,240,232,.4);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}
#errorOverlay h2{font-family:'Cormorant Garamond',serif;color:#ff8080;font-size:22px;font-weight:400}
#errorOverlay p{color:rgba(245,240,232,.4);font-size:13px;line-height:1.8;font-weight:300;max-width:300px}
#modelLoader{position:fixed;top:174px;left:50%;transform:translateX(-50%);background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--gold-border);border-radius:var(--radius-pill);padding:7px 18px;color:rgba(245,240,232,.6);font-size:10px;letter-spacing:.14em;text-transform:uppercase;z-index:300;display:none;align-items:center;gap:9px}
#modelLoader.show{display:flex}
.ml-col{display:flex;flex-direction:column;gap:5px}
.ml-bar{width:120px;height:3px;border-radius:3px;background:rgba(201,168,76,.2);overflow:hidden}
#mlFill{display:block;height:100%;width:0;background:var(--gold);border-radius:3px;transition:width .2s ease}
#modelLoader.indet #mlFill{width:40%!important;animation:mlSlide 1.1s ease-in-out infinite}
@keyframes mlSlide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
#mlPct{font-weight:500;color:var(--gold-light);min-width:30px;text-align:right;font-size:10px;letter-spacing:.06em}
.mini-spin{width:11px;height:11px;border:1.5px solid rgba(201,168,76,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}

/* LOGO / CAROUSEL */
#logo{position:fixed;top:14px;left:14px;width:60px;z-index:200;opacity:0;pointer-events:none;transition:opacity .5s;filter:brightness(0) invert(1) sepia(1) saturate(.5)}
#dishCarousel{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;overflow-x:auto;max-width:calc(100vw - 20px);padding:10px 16px;background:var(--glass-dark);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--gold-border);border-radius:60px;scrollbar-width:none;z-index:150;opacity:0;pointer-events:none;transition:opacity .5s}
#dishCarousel::-webkit-scrollbar{display:none}
.dish-thumb{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;flex-shrink:0;padding:4px 6px;border-radius:50px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .25s}
.dish-thumb.active{background:var(--gold-dim)}
.thumb-img-wrap{width:50px;height:50px}
.dish-thumb img{width:50px;height:50px;object-fit:cover;border-radius:50%;border:1.5px solid rgba(201,168,76,.15);transition:.25s;pointer-events:none;display:block}
.dish-thumb.active img{border-color:var(--gold);transform:scale(1.06)}
.dish-thumb span{font-size:8.5px;letter-spacing:.05em;color:var(--text-sub);font-weight:700;text-align:center;max-width:58px;line-height:1.3;text-transform:uppercase}
.dish-thumb.active span{color:var(--text-main)}

/* SCAN HINT */
#scanHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:none;z-index:10;opacity:0;transition:opacity .5s}
.scan-frame{position:relative;width:180px;height:180px;border:1px dashed rgba(201,168,76,.35);border-radius:6px}
.scan-line{position:absolute;left:8px;right:8px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scanLine 2.4s ease-in-out infinite}
@keyframes scanLine{0%,100%{top:8px;opacity:0}10%,90%{opacity:1}50%{top:calc(100% - 8px)}}
#scanHint p{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,240,232,.45)}

/* SWIPE */
#swipeZone{position:fixed;inset:0;z-index:100;touch-action:pan-y;pointer-events:none}
#swipeZone.active{pointer-events:auto}
#swipeHint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;gap:24px;pointer-events:none;z-index:200;opacity:0;transition:opacity .4s}
#swipeHint.show{opacity:1}
.swipe-arrow{display:flex;flex-direction:column;align-items:center;gap:6px}
.swipe-arrow-icon{width:44px;height:44px;border:1px solid var(--gold-border);border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass-dark)}
.swipe-arrow-icon svg{width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.swipe-arrow span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(245,240,232,.4)}
#dishCounter{display:none!important;position:fixed;top:54px;left:50%;transform:translateX(-50%);background:var(--glass-dark);border:1px solid var(--gold-border);border-radius:var(--radius-pill);padding:5px 16px;gap:8px;z-index:200;opacity:0;pointer-events:none;transition:opacity .4s}
.counter-dot{width:4px;height:4px;border-radius:50%;background:rgba(201,168,76,.25);transition:.25s}
.counter-dot.active{background:var(--gold);transform:scale(1.4)}
#swipeFlash{position:fixed;inset:0;pointer-events:none;z-index:99;opacity:0}
#swipeFlash.left{background:linear-gradient(to right,rgba(201,168,76,.06),transparent)}
#swipeFlash.right{background:linear-gradient(to left,rgba(201,168,76,.06),transparent)}
#swipeFlash.flash{animation:flashFade .35s ease-out forwards}
@keyframes flashFade{0%{opacity:1}100%{opacity:0}}

/* ══ HUD: info card, leader line, brand, controls ══ */
#hudCard{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:max-content;max-width:calc(100vw - 120px);z-index:210;pointer-events:none;opacity:0;transition:opacity .4s}
#hudPill{display:flex;padding:3px;border-radius:100px;border:1px solid var(--gold-border);background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);max-width:100%}
#hudCard.show{opacity:1}
#hudName{min-height:34px;padding:0 20px;display:flex;align-items:center;justify-content:center;border-radius:100px;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1305;font-family:'Jost',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@supports(padding-bottom:env(safe-area-inset-bottom)){
#dishCarousel{bottom:calc(20px + env(safe-area-inset-bottom))}}
@media(max-width:390px){.dish-thumb img,.thumb-img-wrap{width:42px;height:42px}#startScreen h1{font-size:30px}}

/* ══ FLAGSHIP UI ══ */
.tags{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:100px;background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--gold-border);color:var(--text-sub);font-weight:700;white-space:nowrap}
#actionBar{position:fixed;left:50%;bottom:132px;transform:translateX(-50%);display:flex;gap:8px;width:calc(100vw - 28px);max-width:420px;z-index:170;opacity:0;pointer-events:none;transition:opacity .5s}
#actionBar a{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:100px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid var(--gold-border);background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--gold-light);-webkit-tap-highlight-color:transparent}
#actionBar a.primary{flex:1.7;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1305;font-weight:500;border-color:var(--gold)}
#snapBtn{position:fixed;right:14px;z-index:200;border:1px solid var(--gold-border);background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:var(--gold-light);cursor:pointer;-webkit-tap-highlight-color:transparent}
#snapBtn{top:14px;width:44px;height:44px;border-radius:50%;font-size:18px;opacity:0;pointer-events:none;transition:opacity .5s}
#spinToast{position:fixed;top:174px;left:50%;transform:translateX(-50%);z-index:210;padding:7px 16px;border-radius:100px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:var(--glass-dark);border:1px solid var(--gold-border);color:var(--gold-light);opacity:0;pointer-events:none;transition:opacity .3s}
#spinToast.show{opacity:1}
#modeToggle{position:fixed;left:50%;bottom:186px;transform:translateX(-50%);z-index:170;display:flex;padding:3px;border-radius:100px;border:1px solid var(--gold-border);background:var(--glass-dark);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .5s}
#modeToggle button{min-height:34px;padding:0 16px;border:0;border-radius:100px;background:transparent;color:rgba(245,240,232,.6);font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .25s,color .25s}
#modeToggle button.on{background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#1a1305;font-weight:500}
/* ══ REVEAL ANIMATIONS (info card, divider, hotspot) ══ */
@keyframes cardIn{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
@keyframes fadeOnly{from{opacity:0}}
@keyframes dotPop{from{transform:scale(0);opacity:0}}
#hudCard.reveal{animation:cardIn .9s cubic-bezier(.22,.8,.3,1) .7s backwards}
#hudCard.reveal #hudName{animation:fadeUp .7s ease .95s backwards}
#hudCard.reveal .tags{animation:fadeUp .7s ease 1.25s backwards}

/* ══ STORY CAPTION · MOOD ══ */
#storyCap{position:fixed;left:50%;bottom:236px;transform:translateX(-50%);max-width:calc(100vw - 36px);padding:9px 18px;border-radius:22px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;font-size:16px;line-height:1.3;color:var(--cream);background:var(--glass-dark);border:1px solid var(--gold-border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:175;opacity:0;pointer-events:none;transition:opacity .6s ease}
#storyCap.show{opacity:1}
#moodPill{max-width:100%;padding:5px 12px;border-radius:14px;text-align:center;font-size:10.5px;font-weight:500;letter-spacing:.05em;line-height:1.35;color:var(--cream);background:var(--glass-dark);border:1px solid var(--gold-border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#moodPill:empty{display:none}
#moodTint{position:fixed;inset:0;pointer-events:none;z-index:90;opacity:0;transition:opacity 1.2s ease,background 1.2s ease;background:radial-gradient(ellipse at center,rgba(255,150,50,0) 45%,rgba(255,120,30,var(--mt,0)) 100%)}
</style>
</head>
<body>

<div id="startScreen"><div class="start-inner">
  <img class="start-logo" src="logo1.png" onerror="this.style.display='none'" alt="Logo">
  <button id="startBtn">See Dishes in 3D</button>
</div></div>

<div id="loadingOverlay"><div class="loading-ring"></div><p id="loadingStatus">Starting camera</p></div>
<div id="modelLoader"><div class="mini-spin"></div><div class="ml-col"><span id="mlText">Loading dish</span><div class="ml-bar"><i id="mlFill"></i></div></div><b id="mlPct"></b></div>

<div id="errorOverlay">
  <h2>Camera Access Denied</h2>
  <p>Please allow camera access in your browser settings and try again.<br><br>
  <strong style="color:rgba(245,240,232,.6)">iPhone:</strong> Settings → Safari → Camera → Allow<br>
  <strong style="color:rgba(245,240,232,.6)">Android:</strong> Settings → Apps → Browser → Camera → Allow</p>
  <button id="retryBtn">Retry</button>
</div>

<img src="logo1.png" id="logo" alt="Logo">
<div id="dishCounter"></div>

<div id="swipeHint">
  <div class="swipe-arrow"><div class="swipe-arrow-icon"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div><span>Prev</span></div>
  <div class="swipe-arrow"><div class="swipe-arrow-icon"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div><span>Next</span></div>
</div>
<div id="swipeFlash"></div>
<div id="moodTint"></div>
<div id="swipeZone"></div>

<!-- HUD -->
<div id="hudCard"><div id="hudPill"><div id="hudName"></div></div><div class="tags" id="hudTags"></div><div id="moodPill"></div></div>


<div id="spinToast"></div>
<button id="snapBtn" aria-label="Capture and share">📸</button>
<div id="storyCap"></div>
<div id="modeToggle"><button data-m="card" class="on">View on card</button><button data-m="table">View on table</button></div>
<div id="actionBar">
  <a data-a="reserve" class="primary" target="_blank" rel="noopener">Reserve Table</a>
  <a data-a="directions" target="_blank" rel="noopener">Directions</a>
  <a data-a="call">Call</a>
</div>

<div id="scanHint"><div class="scan-frame"><div class="scan-line"></div></div><p>Point at menu card</p></div>
<div id="dishCarousel"></div>

<a-scene id="arScene" gltf-model="dracoDecoderPath: https://www.gstatic.com/draco/v1/decoders/"
  mindar-image="imageTargetSrc: ./targets/card.mind; filterMinCF: 0.1; filterBeta: 10; missTolerance: 10; warmupTolerance: 2; maxTrack: 1; uiLoading: no; uiError: no; uiScanning: no"
  renderer="colorManagement: true; antialias: false; logarithmicDepthBuffer: false; precision: mediump; physicallyCorrectLights: true"
  loading-screen="enabled: false" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false" style="display:none;">

  <a-assets timeout="30000">
    <a-asset-item id="preload0" src="3d-model/KaramisoRamen/KaramisoRamen.glb"></a-asset-item>
  </a-assets>

  <a-light id="lAmb" type="ambient" color="#ffffff" intensity="0.5"></a-light>
  <a-light id="lKey" type="directional" color="#ffffff" intensity="0.9" position="1 3 2"></a-light>
  <a-light type="directional" color="#ffe9c0" intensity="0.5" position="-2 2 -1"></a-light>
  <a-light type="directional" color="#cce8ff" intensity="0.3" position="0 -1 2"></a-light>
  <a-light type="point" color="#fff5e0" intensity="0.6" position="0 1.5 1" distance="4" decay="2"></a-light>

  <a-camera position="0 0 0" look-controls="enabled: false">
  </a-camera>

  <a-entity id="target1" mindar-image-target="targetIndex: 0">
    <a-entity id="spinner"><a-entity id="modelEntity" position="0 0 0" rotation="0 0 0" scale="1 1 1" gltf-model=""></a-entity></a-entity>
  </a-entity>
</a-scene>

<script>
/* ══ EDIT THIS: your restaurant details ══ */
const CONFIG={
  name:'Aurelia', tagline:'Japanese Kitchen',
  phone:'+910000000000',                 // for the Call button
  whatsapp:'910000000000',               // country code + number, no + or spaces
  mapsUrl:'https://maps.google.com/?q=YOUR+RESTAURANT+NAME+Madurai',
  spinMode:'spin',                       // 'sway' = small gentle back-and-forth rotation | 'spin' = slow full 360° turn
  swayDeg:22,                            // sway: how far it turns each side (degrees)
  swaySeconds:7,                         // sway: time for one full left-right-left cycle
  spinDegPerSec:26,                      // 'spin' mode speed: 26 ≈ one turn per 14 s  (0 = rotation off in both modes)
  spinAxis:'z',                          // change to 'y' if the dish spins about the wrong axis
  exposure:1.05,                         // overall brightness (0.8 darker … 1.4 brighter)
  envIntensity:0.4,                      // strength of reflections on the food (lowered to reduce glare)
  shadowOpacity:0.38,                    // soft shadow under the dish (0 = off)
  revealStyle:'cloche',                  // 'splash' | 'flambe' | 'toss' | 'whirl' | 'serve' | 'sizzle' | 'cloche' | 'tempt' | 'scan' | 'jelly' | 'refined' | 'emerge' | 'orbit' | 'drop' | 'random'
  glints:false,                          // twinkling shine on the food (OFF)
  steam:false,                           // rising steam (turned off — set to true to bring it back)
  steamOpacity:0.4,                      // steam visibility (0.3 subtle … 0.8 strong); add steam:false to a dish to disable it
  haptics:false,                         // phone vibration — TURNED OFF
  preload:true,                          // download the next & previous dish in the background so swiping is instant
  tableView:true,                        // "View on card / View on table" toggle: table = markerless placement (Android WebXR / Scene Viewer, iPhone AR Quick Look)
  photoFrame:true,                       // "OOTY 2026" branded frame on the 📸 photo
  frameTitle:'OOTY',                     // ribbon text — the year is added automatically (OOTY 2026)
  frameSub:'The Nilgiris · Tamil Nadu',  // small line under the ribbon
  instagram:'@yourrestaurant',           // printed on every shared photo ('' = hide)
  story:{enabled:true, seconds:5.5},     // short story line shown right after the dish is revealed (edit each dish's story below)
  mood:{enabled:true, lat:11.4102, lon:76.6950, fallbackTemp:15, force:null},   // Ooty weather → warm lighting + message. force:'misty'|'cool'|'sunny'|'evening' to test
  analyticsUrl:''                        // optional: your endpoint to receive events
};
const dishes = [
  { name:"Karamiso Ramen", folder:"KaramisoRamen", model:"KaramisoRamen.glb", thumb:"karamisoramen.png", scale:"4 4 4",       rotation:"90 90 90", tag:"Chef's pick", veg:false, spice:3,
    story:"Slow-simmered for hours in the Nilgiri mist." },
  { name:"Shio Ramen",     folder:"ShioRamen",     model:"ShioRamen.glb",     thumb:"shioramen.png",     scale:"9 9 9",       rotation:"90 90 90", tag:"Light & clean", veg:false, spice:1,
    story:"Clear, light and gently salted, like the morning air." },
  { name:"Shoyu Ramen",    folder:"ShoyuRamen",    model:"ShoyuRamen.glb",    thumb:"shoyuramen.png",    scale:"9 9 9",       rotation:"90 90 90", tag:"Most ordered", veg:false, spice:1,
    story:"Our most ordered bowl. Soy-rich, warm and comforting." },
  { name:"Tantanmen",      folder:"Tantanman",     model:"Tantanman.glb",     thumb:"tantanman.png",     scale:"1.5 1.5 1.5", rotation:"90 90 90", tag:"Bold & nutty", veg:false, spice:3,
    story:"Nutty sesame broth with a bold, spicy heart." },
];

let currentIndex=-1, arStarted=false, starting=false, modelTimeout=null, swipeHintShown=false, markerFound=false;

const $=s=>document.querySelector(s);
const modelEntity=$('#modelEntity'),

/* apply a dish model to an entity */
function applyModel(ent,dish,factor,src){
  ent.removeAttribute('gltf-model');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    ent.setAttribute('gltf-model',src||`3d-model/${dish.folder}/${dish.model}`);
    ent.setAttribute('scale',dish.scale.split(' ').map(v=>v*factor).join(' '));
    ent.setAttribute('rotation',dish.rotation);
    if(ent===modelEntity) ent.setAttribute('position','0 0 0');
  }));
}

function selectDish(index){
  if(index===currentIndex) return;
  currentIndex=index; hideStory(); clearTimeout(storyT0);
  const dish=dishes[index];
  if(modelTimeout) clearTimeout(modelTimeout);
  modelLoader.classList.add('show'); setProgress(null,'reset');
  const myTok=++loadTok;
  loadDishModel(dish,myTok);                                   // downloads with a progress bar (or uses the preloaded copy), then shows it
  modelEntity.addEventListener('model-loaded',()=>{if(myTok!==loadTok)return; modelLoader.classList.remove('show');clearTimeout(modelTimeout)},{once:true});
  modelTimeout=setTimeout(()=>modelLoader.classList.remove('show'),25000);

  // info card text
  $('#hudName').textContent=dish.name;
  $('#hudTags').innerHTML=[
    dish.veg===undefined?'':`<span class="tag">${dish.veg?'🟢 Veg':'🔴 Non-veg'}</span>`,
    dish.spice?`<span class="tag">${'🌶'.repeat(dish.spice)}</span>`:'',
    dish.tag?`<span class="tag">★ ${dish.tag}</span>`:''].join('');
  curDish=dish; onDishView(dish); prepTable(dish);

  document.querySelectorAll('.dish-thumb').forEach((el,i)=>el.classList.toggle('active',i===index));
  {const el=document.querySelectorAll('.dish-thumb')[index]; try{carousel.scrollTo({left:el.offsetLeft-carousel.clientWidth/2+el.clientWidth/2,behavior:'smooth'})}catch(e){carousel.scrollLeft=el.offsetLeft-carousel.clientWidth/2+el.clientWidth/2}}
  document.querySelectorAll('.counter-dot').forEach((el,i)=>el.classList.toggle('active',i===index));
}

async function snapshot(){

  const dpr=Math.min(devicePixelRatio||1,2), W=Math.round(innerWidth*dpr), H=Math.round(innerHeight*dpr);
  const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  if(video&&video.videoWidth){
    const vw=video.videoWidth, vh=video.videoHeight, cr=W/H; let sw=vw, sh=vh, sx=0, sy=0;
    if(vw/vh>cr){sw=vh*cr;sx=(vw-sw)/2}else{sh=vw/cr;sy=(vh-sh)/2}
    x.drawImage(video,sx,sy,sw,sh,0,0,W,H);
  }
  arScene.renderer.render(arScene.object3D,arScene.camera);   // fresh frame so the canvas isn't blank
  x.drawImage(gl,0,0,W,H);
  try{await document.fonts.load('700 20px "Cormorant Garamond"'); await document.fonts.load('700 20px Jost')}catch(e){}
  drawFrame(x,W,H,d);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92)), file=new File([blob],'dish.jpg',{type:'image/jpeg'});
  track('snapshot',{dish:d.name});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:CONFIG.name,text:`Look at ${d.name} at ${CONFIG.name}, Ooty! 😍 ${CONFIG.instagram||''}`});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dish.jpg'; a.click();
}

/* turbulent smoke textures: real multi-octave noise (fbm) → irregular, wispy edges like actual steam */
function smokeTex(seed){
  const S=128, c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d'), img=x.createImageData(S,S);
  const hash=(i,j)=>{let h=(i*374761393+j*668265263+seed*2147483647)|0; h=(h^(h>>>13))*1274126177|0; return ((h^(h>>>16))>>>0)/4294967295};
  const sm=t=>t*t*(3-2*t);
  const vnoise=(px,py)=>{const i=Math.floor(px),j=Math.floor(py),fx=sm(px-i),fy=sm(py-j);
    const a=hash(i,j),b=hash(i+1,j),c2=hash(i,j+1),d=hash(i+1,j+1); return a+(b-a)*fx+(c2-a)*fy+(a-b-c2+d)*fx*fy};
  const fbm=(px,py)=>{let v=0,amp=.5,f=1; for(let o=0;o<5;o++){v+=amp*vnoise(px*f,py*f); f*=2.03; amp*=.5} return v};
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){
    const nx=i/S, ny=j/S, dx=(nx-.5)*2, dy=(ny-.5)*2, r=Math.sqrt(dx*dx+dy*dy);
    const warp=fbm(nx*3+seed*7,ny*3)*1.2;                                  // domain warp = swirly, smoke-like shapes
    let n=fbm(nx*4+warp,ny*4-warp);
    let a=Math.max(0,Math.min(1,(n-.38)*2.6));                             // thin out → wisps with gaps
    a*=Math.max(0,1-Math.pow(r,1.7));                                      // fade to nothing at the tile edge
    const k=(j*S+i)*4; img.data[k]=img.data[k+1]=img.data[k+2]=255; img.data[k+3]=a*255;
  }
  x.putImageData(img,0,0); const t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t;
}

function setProgress(e,mode){
  modelLoader.classList.remove('indet');
  if(mode==='reset'){mlText.textContent='Loading dish'; mlFill.style.width='0%'; mlPct.textContent=''; return}
  if(mode==='prep'){mlText.textContent='Preparing 3D'; mlFill.style.width='100%'; mlPct.textContent=''; return}
  if(e.done){mlFill.style.width='100%'; mlPct.textContent='100%'; return}
  if(e.total){const p=Math.min(99,Math.floor(e.loaded/e.total*100)); mlFill.style.width=p+'%'; mlPct.textContent=p+'%'}
  else{modelLoader.classList.add('indet'); mlPct.textContent=''}      // server didn't send a size → moving bar instead of a percentage
}
async function loadDishModel(dish,tok){
  const path=`3d-model/${dish.folder}/${dish.model}`; let src=path;
  try{
    const e=loadModel(path), sub=ev=>{if(tok===loadTok) setProgress(ev)};
    e.subs.add(sub); setProgress(e);
    src=await e.promise; e.subs.delete(sub);
  }catch(err){console.warn('Model download failed, loading directly',err)}
  if(tok!==loadTok) return;                    // user already swiped to another dish
  setProgress(null,'prep');
  applyModel(modelEntity,dish,1,src);
  preloadNeighbours(currentIndex);
}
function preloadNeighbours(i){                 // next + previous dish quietly in the background
  if(!CONFIG.preload||(navigator.connection&&navigator.connection.saveData)) return;
  const n=dishes.length, list=[...new Set([(i+1)%n,(i-1+n)%n])].filter(j=>j!==i);
  setTimeout(async()=>{for(const j of list){if(currentIndex!==i) return; try{await loadModel(`3d-model/${dishes[j].folder}/${dishes[j].model}`).promise}catch(e){}}},700);
}


/* ══ STORY CAPTION ══ */
const storyCap=$('#storyCap'); let storyTimer=null, storyT0=null;
function showStory(t,ms){clearTimeout(storyTimer); storyCap.textContent=t; storyCap.classList.add('show'); if(ms) storyTimer=setTimeout(hideStory,ms)}
function hideStory(delay){clearTimeout(storyTimer); if(typeof delay==='number'&&delay>0) storyTimer=setTimeout(()=>storyCap.classList.remove('show'),delay); else storyCap.classList.remove('show')}

/* ══ OOTY MOOD LIGHTING (live weather → warm light + message) ══ */
const MOODS={
  misty:  {lamb:['#ffd9a8',.55],key:['#ffe2b8',.95],exp:1.12,tint:.16,label:'Misty',  line:'Perfect ramen weather'},
  cool:   {lamb:['#ffe6c4',.52],key:['#fff0d6',.92],exp:1.08,tint:.09,label:'Cool',   line:'Warm bowl, cool hills'},
  sunny:  {lamb:['#ffffff',.50],key:['#ffffff',.90],exp:1.05,tint:0,  label:'Sunny',  line:'Fresh and light today'},
  evening:{lamb:['#ffcf94',.50],key:['#ffd9a0',.90],exp:1.15,tint:.20,label:'Evening',line:'Cosy bowls for a cool night'}
};
let mood=null;
function pickMood(temp,code,hour,live){
  if(hour>=18||hour<5.5) return 'evening';
  if(!live) return 'cool';
  const wet=[45,48,51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code);
  if(wet||temp<=16) return 'misty';
  if(temp<=22) return 'cool';
  return 'sunny';
}
function applyMood(key,temp,live){
  const m=MOODS[key]; if(!m) return; mood=m;
  const la=$('#lAmb'), lk=$('#lKey');
  if(la){la.setAttribute('color',m.lamb[0]); la.setAttribute('intensity',m.lamb[1])}
  if(lk){lk.setAttribute('color',m.key[0]); lk.setAttribute('intensity',m.key[1])}
  try{if(arScene.renderer) arScene.renderer.toneMappingExposure=CONFIG.exposure*(m.exp/1.05)}catch(e){}
  if(shadowLight) shadowLight.color.set(m.key[0]);
  const tint=$('#moodTint'); tint.style.setProperty('--mt',m.tint); tint.style.opacity=m.tint?'1':'0';
  $('#moodPill').textContent=live&&temp!=null?`${temp}°C · ${m.label} · ${m.line}`:m.line;   // never shows a temperature we don't actually know
}
async function initMood(){
  const cfg=CONFIG.mood; if(!cfg||!cfg.enabled) return;
  const d=new Date(), hour=d.getHours()+d.getMinutes()/60; let temp=null, code=-1, live=false;
  try{
    const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),4000);
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cfg.lat}&longitude=${cfg.lon}&current=temperature_2m,weather_code`,{signal:ctl.signal});
    clearTimeout(to); const j=await r.json();
    temp=Math.round(j.current.temperature_2m); code=j.current.weather_code; live=true;
  }catch(e){ temp=cfg.fallbackTemp }
  applyMood(cfg.force||pickMood(temp,code,hour,live),temp,live);
}

/* per-frame loop: rotation, reveal effects, info card visibility */
function hudFrame(){
  requestAnimationFrame(hudFrame);
  const now=performance.now(), dt=Math.min((now-lastT)/1000,.1); lastT=now;
  if(spinOn&&markerFound){
    if(CONFIG.spinMode==='sway'){swayT+=dt; const a=d2r(CONFIG.swayDeg)*Math.sin(swayT*2*Math.PI/CONFIG.swaySeconds); spinner.object3D.rotation[CONFIG.spinAxis]+=a-swayAng; swayAng=a}
    else spinner.object3D.rotation[CONFIG.spinAxis]+=d2r(CONFIG.spinDegPerSec)*dt;
  }
  fxUpdate(dt);
  const live=arStarted&&currentIndex>=0&&markerFound;
  hudCard.classList.toggle('show',live);
}
hudFrame();

/* ══ MARKERLESS TABLE PLACEMENT ══
   Android: WebXR (in page) → Scene Viewer fallback · iPhone: AR Quick Look (USDZ built from the GLB, or your own .usdz via dish.usdz)
   The camera is handed over to the native AR view, then MindAR is brought back when you return. */
const modeToggle=$('#modeToggle'), isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let tableMV=null, tableOpen=false, tableT=0, xrActive=false;
if(!CONFIG.tableView||!(isIOS||/Android/i.test(navigator.userAgent))) modeToggle.style.display='none';
function toast(msg){const t=$('#spinToast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400)}
const mindar=()=>arScene.systems&&arScene.systems['mindar-image-system'];
const abs=path=>new URL(path,location.href).href;
function prepTable(dish){                                  // keeps a hidden <model-viewer> loaded with the current dish so the tap can launch AR instantly
  if(!CONFIG.tableView||modeToggle.style.display==='none'||!customElements.get('model-viewer')) return;
  if(!tableMV){
    tableMV=document.createElement('model-viewer');
    tableMV.setAttribute('ar',''); tableMV.setAttribute('ar-modes','webxr scene-viewer quick-look');
    tableMV.setAttribute('ar-placement','floor'); tableMV.setAttribute('ar-scale','auto'); tableMV.setAttribute('loading','eager');
    tableMV.style.cssText='position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;z-index:-2';
    tableMV.addEventListener('ar-status',e=>{const st=e.detail&&e.detail.status;
      if(st==='session-started') xrActive=true;
      if(st==='not-presenting'||st==='failed'){xrActive=false; resumeFromTable(true)}});
    document.body.appendChild(tableMV);
  }
  const url=abs(`3d-model/${dish.folder}/${dish.model}`);
  if(tableMV.getAttribute('src')!==url) tableMV.setAttribute('src',url);
  if(dish.usdz) tableMV.setAttribute('ios-src',abs(`3d-model/${dish.folder}/${dish.usdz}`)); else tableMV.removeAttribute('ios-src');
  tableMV.setAttribute('alt',dish.name);
}
async function restartMindAR(){
  const m=mindar(); if(!m) return;
  try{await m.stop()}catch(e){}
  try{await m.start()}catch(e){console.warn('AR restart failed',e);location.reload()}
}
function resumeFromTable(force){
  if(!tableOpen||xrActive||(!force&&Date.now()-tableT<1500)) return;
  tableOpen=false; hideTarget(); setMode('card');
  const v=document.querySelector('video'), tr=v&&v.srcObject&&v.srcObject.getVideoTracks&&v.srcObject.getVideoTracks()[0];
  if(!(tr&&tr.readyState==='live'&&!tr.muted)) restartMindAR();   // camera was released (Android, or iOS interrupted it) → bring marker tracking back
}
['visibilitychange','pageshow','focus'].forEach(ev=>(ev==='focus'||ev==='pageshow'?window:document).addEventListener(ev,()=>{if(!document.hidden) resumeFromTable()}));
function hideTarget(){                     // marker tracking is paused during table view → make sure the dish isn't left frozen on screen
  markerFound=false; try{target.object3D.visible=false}catch(e){}
  if(arStarted) scanHint.style.opacity='1';
}
function openTable(){
  if(!tableMV||!tableMV.loaded){toast('Preparing 3D dish… try again');return}
  if(!tableMV.canActivateAR){toast(isIOS?'Open this page in Safari for table view':'Table view needs Chrome with ARCore');return}
  track('table_view',{dish:curDish.name});
  tableOpen=true; tableT=Date.now(); xrActive=false; setMode('table');
  hideTarget();
  if(!isIOS){try{const m=mindar(); if(m) m.stop()}catch(e){}}   // Android: free the camera for WebXR / Scene Viewer
  try{tableMV.activateAR()}catch(e){console.warn(e);tableOpen=false;setMode('card');restartMindAR();toast('Could not open table view')}
}
const setMode=m=>modeToggle.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
modeToggle.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.m==='table') openTable(); else setMode('card')}));

/* START AR */
async function startAR(){
  if(arStarted||starting) return; starting=true;
  track('scan_start');
  startScreen.style.opacity='0'; setTimeout(()=>startScreen.style.display='none',400);
  loadingOverlay.classList.add('show'); loadingStatus.textContent='Starting camera';
  try{
    const tries=[{facingMode:{exact:'environment'}},{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},true];   // fall back step by step so every phone gets a camera
    let stream=null, lastErr=null;
    for(const vc of tries){try{stream=await navigator.mediaDevices.getUserMedia({video:vc,audio:false});break}catch(e){lastErr=e; if(e&&e.name==='NotAllowedError')break}}
    if(!stream) throw lastErr||new Error('No camera');
    stream.getTracks().forEach(t=>t.stop());
    loadingStatus.textContent='Initialising AR';
    arScene.style.display='block';
    let fired=false;
    const onReady=()=>{
      if(fired) return; fired=true;
      loadingOverlay.classList.remove('show');
      scanHint.style.opacity='1'; arStarted=true;
      swipeZone.classList.add('active');
      alwaysVisible.forEach(el=>{el.style.opacity='1';el.style.pointerEvents='auto'});
      setupRender(); selectDish(0); showSwipeHintOnce(); initMood();
    };
    arScene.addEventListener('loaded',onReady,{once:true});
    arScene.addEventListener('arReady',onReady,{once:true});
    setTimeout(onReady,3000);
  }catch(err){
    console.error('Camera error:',err); starting=false;
    loadingOverlay.classList.remove('show'); errorOverlay.classList.add('show');
  }
}
['click','touchend'].forEach(evt=>{
  $('#startBtn').addEventListener(evt,e=>{e.preventDefault();startAR()});
  $('#retryBtn').addEventListener(evt,e=>{e.preventDefault();errorOverlay.classList.remove('show');startScreen.style.display='flex';startScreen.style.opacity='1'});
});

target.addEventListener('targetFound',()=>{markerFound=true;playEntry();track('marker_found');scanHint.style.opacity='0'});
target.addEventListener('targetLost',()=>{markerFound=false;scanHint.style.opacity='1'; clearTimeout(storyT0); hideStory()});
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
